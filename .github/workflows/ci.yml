# Tests auf Windows und Linux bei jedem Push. Bei einem Versions-Tag (v1.2.3)
# zusätzlich beide Programme bauen und das GitHub-Release damit anlegen –
# daraus holt sich die Update-Funktion der installierten Overlays die neue Version.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write      # Release anlegen
  id-token: write      # Herkunftsnachweis (Sigstore)
  attestations: write
  actions: read        # SignPath lädt das unsignierte Artefakt

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: dist/SC-Playtime.exe
            asset: SC-Playtime.exe
          # ältere glibc als ubuntu-latest → läuft auf mehr Distributionen
          - os: ubuntu-22.04
            file: dist/SC-Playtime
            asset: SC-Playtime-linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # Secrets sind in "if:" nicht direkt abfragbar, Umgebungsvariablen schon
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pyinstaller
      - name: Version im Code muss zum Tag passen
        shell: bash
        run: |
          code=$(python -c "import sc_playtime; print(sc_playtime.__version__)")
          test "v$code" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} ≠ Version $code"; exit 1; }
      - run: python build.py
      - shell: bash
        run: mkdir out && cp "${{ matrix.file }}" "out/${{ matrix.asset }}"

      # --- Windows-Signatur über SignPath Foundation (kostenlos für Open Source) ---
      # Läuft erst, wenn das Secret SIGNPATH_API_TOKEN und die Variable
      # SIGNPATH_ORGANIZATION_ID gesetzt sind (siehe CODE_SIGNING.md). Bis dahin
      # wird unsigniert veröffentlicht.
      - name: Unsignierte EXE für SignPath bereitstellen
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.asset }}
          path: out/${{ matrix.asset }}
      - name: Mit SignPath signieren
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sc-playtime
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Signierte EXE übernehmen
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: cp "signed/${{ matrix.asset }}" "out/${{ matrix.asset }}"

      # Herkunftsnachweis: belegt, dass die Datei aus genau diesem Commit gebaut wurde.
      # Prüfen: gh attestation verify <datei> --repo hofergeorg-tech/sc-playtime
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - run: python3 release_notes.py "${GITHUB_REF_NAME}" > notes.md
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "SC Playtime ${GITHUB_REF_NAME#v}" --notes-file notes.md
